[project]
name = "ins-c2-014"
version = "0.1.0"
description = "Insurance Claims Summary Generator — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# installed from the package registry by CI. Pinning it here would make
# `pip install -e .` fail because it is not resolvable from the default index.
# PyYAML is imported directly by src/services/service.py to read
# config/config.yaml, so it is declared explicitly rather than relied on as a
# transitive dependency; the pin matches the framework's own.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    "PyYAML==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.6",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "types-PyYAML==6.0.12.20260815",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# Framework-wheel compatibility exception: the published agenticstar-agentcore
# wheel ships no py.typed marker, so framework.* / shared.* imports resolve to
# Any — which makes every required framework subclass an [import-untyped] /
# "subclass of Any" error. All other strict settings stay on.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*", "langgraph.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The untyped wheel makes AgentState resolve to Any, so every field of a
# TypedDict subclassing it fails [valid-type]. The errors are all one cause, not
# a per-field problem; suppressing the code on this module alone keeps the rest
# of strict mode active everywhere else.
module = ["src.schemas.state"]
disable_error_code = ["valid-type"]
